<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hosting Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 15px;
      color: #222;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    .status {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: #e8f7ee;
      color: #16803c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 Hosting Test</h1>

    <p>
      If you can see this page, the hosting is working correctly!
    </p>

    <span class="status">
      ✓ Website Online
    </span>
  </div>

</body>
</html>
